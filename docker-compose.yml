services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: farm-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farm_ai}
      POSTGRES_USER: ${POSTGRES_USER:-farm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farm_user} -d ${POSTGRES_DB:-farm_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-server:
    build: ./ai-server
    container_name: farm-ai-ai-server
    restart: unless-stopped
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"

  reranker-server:
    build: ./reranker-server
    container_name: farm-ai-reranker-server
    restart: unless-stopped
    environment:
      RERANKER_MODEL: ${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
      RERANKER_LOAD_ON_STARTUP: ${RERANKER_LOAD_ON_STARTUP:-true}
      RERANKER_ALLOW_FALLBACK: ${RERANKER_ALLOW_FALLBACK:-true}
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
    ports:
      - "${RERANKER_SERVER_PORT:-8010}:8010"
    volumes:
      - reranker_model_cache:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8010/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  opensearch:
    image: opensearchproject/opensearch:2.19.4
    container_name: farm-ai-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_PERFORMANCE_ANALYZER_PORT:-9600}:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend-spring:
    build: ./backend-spring
    container_name: farm-ai-backend-spring
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_PORT: ${SPRING_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-farm_ai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-farm_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-farm_password}
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL:-http://ai-server:8000}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-long-secret-for-local-development-please-change}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-text-embedding-3-small}
      APP_EMBEDDING_DIMENSION: ${APP_EMBEDDING_DIMENSION:-1536}
      APP_CHAT_MODEL: ${APP_CHAT_MODEL:-gpt-4.1-mini}
      APP_LLM_ENABLED: ${APP_LLM_ENABLED:-false}
      APP_RAG_TOP_K: ${APP_RAG_TOP_K:-4}
      APP_RAG_SIMILARITY_THRESHOLD: ${APP_RAG_SIMILARITY_THRESHOLD:-0.35}
      APP_DOCUMENT_CHUNK_SIZE: ${APP_DOCUMENT_CHUNK_SIZE:-1200}
      APP_DOCUMENT_CHUNK_OVERLAP: ${APP_DOCUMENT_CHUNK_OVERLAP:-200}
      APP_STORAGE_UPLOAD_DIR: /app/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENSEARCH_BASE_URL: ${OPENSEARCH_BASE_URL:-http://opensearch:9200}
      OPENSEARCH_INDEX_NAME: ${OPENSEARCH_INDEX_NAME:-rag_chunks_v1_default}
      RERANKER_SERVER_BASE_URL: ${RERANKER_SERVER_BASE_URL:-http://reranker-server:8010}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      RERANKER_READ_TIMEOUT: ${RERANKER_READ_TIMEOUT:-180s}
      KAMIS_API_KEY: ${KAMIS_API_KEY:-replace-me}
      KAMIS_CUSTOMER_ID: ${KAMIS_CUSTOMER_ID:-replace-me}
    ports:
      - "${SPRING_PORT:-8080}:8080"
    volumes:
      - spring_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-server:
        condition: service_started
      opensearch:
        condition: service_healthy
      reranker-server:
        condition: service_healthy

volumes:
  postgres_data:
  spring_uploads:
  opensearch_data:
  reranker_model_cache:
