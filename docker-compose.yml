services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: farm-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farm_ai}
      POSTGRES_USER: ${POSTGRES_USER:-farm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farm_user} -d ${POSTGRES_DB:-farm_ai}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-server:
    build: ./ai-server
    container_name: farm-ai-ai-server
    restart: unless-stopped
    ports:
      - "8000:8000"

  backend-spring:
    build: ./backend-spring
    container_name: farm-ai-backend-spring
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SPRING_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-farm_ai}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-farm_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-farm_password}
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL:-http://ai-server:8000}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-long-secret-for-local-development-please-change}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-3600000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-me}
      KAMIS_API_KEY: ${KAMIS_API_KEY:-replace-me}
      KAMIS_CUSTOMER_ID: ${KAMIS_CUSTOMER_ID:-replace-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-server:
        condition: service_started

volumes:
  postgres_data:
