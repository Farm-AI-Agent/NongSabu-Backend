services:
  db:
    image: pgvector/pgvector:pg16
    container_name: nongsabu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nongsabu}
      POSTGRES_USER: ${POSTGRES_USER:-nongsabu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nongsabu1234}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-spring/db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nongsabu} -d ${POSTGRES_DB:-nongsabu}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ai-server:
    build:
      context: ./ai-server
    container_name: nongsabu-ai-server
    restart: unless-stopped
    environment:
      AI_SERVER_PORT: ${AI_SERVER_PORT:-8000}
    ports:
      - "${AI_SERVER_PORT:-8000}:8000"

  backend-spring:
    build:
      context: ./backend-spring
    container_name: nongsabu-backend-spring
    restart: unless-stopped
    environment:
      SPRING_PORT: ${SPRING_PORT:-8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-nongsabu}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nongsabu}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nongsabu1234}
      AI_SERVER_BASE_URL: ${AI_SERVER_BASE_URL:-http://ai-server:8000}
      APP_JWT_SECRET: ${JWT_SECRET:-change-this-secret-for-local-dev}
      APP_JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      APP_EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      APP_CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
      APP_RAG_TOP_K: ${RAG_TOP_K:-4}
      APP_RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.35}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      APP_DOCUMENT_CHUNK_SIZE: ${DOCUMENT_CHUNK_SIZE:-1200}
      APP_DOCUMENT_CHUNK_OVERLAP: ${DOCUMENT_CHUNK_OVERLAP:-200}
      APP_STORAGE_UPLOAD_DIR: /app/uploads
    ports:
      - "${SPRING_PORT:-8080}:8080"
    volumes:
      - spring_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      ai-server:
        condition: service_started

volumes:
  postgres_data:
  spring_uploads:
