server:
  port: ${SPRING_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  application:
    name: farm-ai-backend
  ai:
    model:
      chat: openai
      embedding: openai
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      api-key: ${OPENAI_API_KEY:not-configured}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${APP_CHAT_MODEL:gpt-4.1-mini}
      embedding:
        options:
          model: ${APP_EMBEDDING_MODEL:text-embedding-3-small}
          dimensions: ${APP_EMBEDDING_DIMENSION:1536}
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${APP_EMBEDDING_DIMENSION:1536}
        max-document-batch-size: 1000
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/farm_ai}
    username: ${SPRING_DATASOURCE_USERNAME:farm_user}
    password: ${SPRING_DATASOURCE_PASSWORD:farm_password}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      embeddingDimension: ${APP_EMBEDDING_DIMENSION:1536}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

app:
  jwt:
    secret: ${JWT_SECRET:replace-this-with-long-secret-for-local-development-please-change}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  ai-server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
  embedding:
    model: ${APP_EMBEDDING_MODEL:text-embedding-3-small}
    dimension: ${APP_EMBEDDING_DIMENSION:1536}
  rag:
    top-k: ${APP_RAG_TOP_K:4}
    similarity-threshold: ${APP_RAG_SIMILARITY_THRESHOLD:0.35}
    hybrid-candidate-size: ${APP_RAG_HYBRID_CANDIDATE_SIZE:20}
  document:
    chunk-size: ${APP_DOCUMENT_CHUNK_SIZE:1200}
    chunk-overlap: ${APP_DOCUMENT_CHUNK_OVERLAP:200}
  opensearch:
    base-url: ${OPENSEARCH_BASE_URL:http://localhost:9200}
    index-name: ${OPENSEARCH_INDEX_NAME:rag_chunks_v1_default}
    connect-timeout: ${OPENSEARCH_CONNECT_TIMEOUT:3s}
    read-timeout: ${OPENSEARCH_READ_TIMEOUT:10s}
  reranker:
    enabled: ${RERANKER_ENABLED:true}
    base-url: ${RERANKER_SERVER_BASE_URL:http://localhost:8010}
    read-timeout: ${RERANKER_READ_TIMEOUT:180s}
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  external:
    openai-api-key: ${OPENAI_API_KEY:replace-me}
    kamis-api-key: ${KAMIS_API_KEY:replace-me}
    kamis-customer-id: ${KAMIS_CUSTOMER_ID:replace-me}

logging:
  level:
    root: INFO
    com.nongsabu.backend: DEBUG
