server:
  port: ${SPRING_PORT:8080}

spring:
  application:
    name: nongsabu-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nongsabu}
    username: ${SPRING_DATASOURCE_USERNAME:nongsabu}
    password: ${SPRING_DATASOURCE_PASSWORD:nongsabu1234}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-this-secret-for-local-dev}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  ai-server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
  embedding:
    dimension: ${APP_EMBEDDING_DIMENSION:8}
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:uploads}

logging:
  level:
    root: INFO
    com.nongsabu.backend: DEBUG
